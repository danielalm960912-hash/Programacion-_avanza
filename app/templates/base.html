<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Predictor Saber 11{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('web.prediccion') }}">Predictor Saber 11 · Antioquia</a>
      <div class="navbar-nav">
        <a class="nav-link {% if activa == 'prediccion' %}active{% endif %}" href="{{ url_for('web.prediccion') }}">Predicción</a>
        <a class="nav-link {% if activa == 'historial' %}active{% endif %}" href="{{ url_for('web.historial') }}">Historial</a>
        <a class="nav-link {% if activa == 'datos' %}active{% endif %}" href="{{ url_for('web.datos') }}">Datos</a>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    {% block contenido %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
